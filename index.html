<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Pilzmap</title>
  <meta name="description" content="Habitat suitability map for edible mushrooms in Berlin and Brandenburg, built from open forest site, tree species and protected area data.">
  <meta name="theme-color" content="#f6f5f0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/maplibre-gl-4.7.1/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css?v=0.3.0">
</head>
<body>
  <div id="root">
    <div id="map" aria-label="Map"></div>

    <header class="top-chrome">
      <div class="brand">
        <span class="brand-name">Pilzmap</span>
        <span class="version" id="version"></span>
      </div>
      <div class="top-actions">
        <div class="lang" id="lang" role="group"></div>
        <button class="icon-btn" id="info-btn" aria-label="Method, data and legal">i</button>
      </div>
    </header>

    <section class="sheet bottom-chrome" id="sheet">
      <div class="chips" id="chips" role="tablist" aria-label="Species"></div>
      <div class="card" id="card"></div>
      <div class="legend" id="legend"></div>
    </section>

    <dialog id="info">
      <div class="dialog-body" id="info-body"></div>
      <form method="dialog"><button class="btn" id="close-btn">Close</button></form>
    </dialog>
  </div>

  <script src="vendor/maplibre-gl-4.7.1/maplibre-gl.js"></script>
  <script type="module" src="js/main.js?v=0.3.0"></script>
</body>
</html>
